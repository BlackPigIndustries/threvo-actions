<!doctype html>
<html lang="el">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Threvo Actions · Stripe refunds</title>
<style>
/* Portable subset of Threvo's frontend/src/index.css tokens. */
:root{--background:#fff;--foreground:#0b0f1a;--muted:#f8fafc;--muted-foreground:#536479;--border:#e2e8f0;--signal-fill:#b8e600;--success-bg:#e6faf2;--success-text:#0f7a50;--warning-bg:#fef6dd;--warning-text:#8a5a00;--error-text:#a61e1e;--radius:8px;--font-sans:'DM Sans',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--muted);color:var(--foreground);font:15px/1.5 var(--font-sans)}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;background:var(--background);color:var(--foreground)}button:hover{border-color:var(--muted-foreground)}button:disabled{cursor:wait;opacity:.5;background:var(--border)}:focus-visible{outline:3px solid var(--foreground);outline-offset:3px}.primary{background:var(--signal-fill);border-color:transparent;font-weight:700}header{background:var(--background);border-bottom:1px solid var(--border);padding:20px 5vw;display:flex;align-items:center;gap:18px}header strong{letter-spacing:-.8px;font-size:23px}header span{font:11px var(--font-mono);letter-spacing:1px}header button{margin-left:auto}main{max-width:1200px;margin:48px auto;padding:0 28px}h1{font-size:38px;letter-spacing:-1.3px;margin:0 0 8px;line-height:1.15}h2{font-size:19px;letter-spacing:-.4px;margin:0 0 20px}p{color:var(--muted-foreground);margin:8px 0 24px}.eyebrow,.label,th{font:11px var(--font-mono);letter-spacing:1px;text-transform:uppercase}.eyebrow{margin-bottom:12px}.panel{background:var(--background);border:1px solid var(--border);border-radius:var(--radius);padding:26px}.login{max-width:520px;margin:70px auto}.login button{width:100%;margin-top:16px}label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}input,textarea{border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;width:100%;background:var(--background);color:var(--foreground)}textarea{resize:vertical;min-height:85px}.layout{display:grid;grid-template-columns:330px 1fr;gap:24px}.strip{display:flex;border-block:1px solid var(--border);margin:30px 0; padding:22px 0}.metric{padding:0 35px;border-right:1px solid var(--border);flex:1}.metric:first-child{padding-left:0}.metric:last-child{border:0}.metric b{display:block;font:30px var(--font-mono);margin:8px 0}.metric span{color:var(--muted-foreground);font-size:13px}.inline{display:flex;gap:12px}.inline>*{min-width:0;flex:1}.full{width:100%;margin-top:20px}.row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:20px 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}.row strong{display:block}.money,.date{font-family:var(--font-mono);font-variant-numeric:tabular-nums}.money{font-size:17px}.date{font-size:11px;color:var(--muted-foreground)}.badge{display:inline-block;padding:4px 9px;border-radius:30px;background:var(--muted);font-size:11px;margin-top:6px}.badge.verified{background:var(--success-bg);color:var(--success-text)}.badge.awaiting_authority{background:var(--warning-bg);color:var(--warning-text)}.empty{padding:45px 0;text-align:center}.toolbar{display:flex;justify-content:space-between;align-items:center}.toolbar h2{margin:0}.toolbar button{font-size:12px}.notice{min-height:26px;color:var(--error-text);margin:16px 0}.small{font-size:12px}.assistant{margin-top:24px}dialog{border:1px solid var(--border);border-radius:var(--radius);padding:30px;max-width:480px;width:calc(100% - 32px)}dialog::backdrop{background:rgb(11 15 26 / .45)}dialog .money{font-size:32px;margin:20px 0}dialog .inline{margin-top:24px}.hidden,[hidden]{display:none!important}footer{margin-top:35px;border-top:1px solid var(--border);padding-top:20px;font-size:12px;color:var(--muted-foreground)}@media(max-width:760px){main{margin-top:28px;padding:0 18px}.layout{grid-template-columns:1fr}.metric{padding:0 12px}h1{font-size:30px}header span{display:none}.panel{padding:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body>
<header><strong>threvo actions</strong><span>STRIPE / SANDBOX</span><button id="language" aria-label="Change language">English</button><button id="logout" hidden data-i18n="logout"></button></header>
<main>
<section id="login" class="panel login"><div class="eyebrow">REFUND OPERATIONS</div><h1 data-i18n="welcome"></h1><p data-i18n="signinDescription"></p><form id="loginForm"><label for="token" data-i18n="token"></label><input id="token" type="password" autocomplete="off" required><button class="primary" data-i18n="signin"></button></form></section>
<section id="workspace" hidden><div class="eyebrow" id="role"></div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p>
<div class="strip"><div class="metric"><span data-i18n="waiting"></span><b id="waitingCount">0</b></div><div class="metric"><span data-i18n="verifiedMetric"></span><b id="verifiedCount">0</b></div><div class="metric"><span data-i18n="total"></span><b id="totalCount">0</b></div></div>
<div class="layout"><aside><section class="panel" id="requestPanel"><h2 data-i18n="newRefund"></h2><form id="refundForm"><label for="order" data-i18n="order"></label><input id="order" required maxlength="120"><label for="intent" data-i18n="intent"></label><input id="intent" required maxlength="120"><div class="inline"><div><label for="amount" data-i18n="amount"></label><input id="amount" inputmode="decimal" pattern="[0-9]+(\.[0-9]{1,3})?" required></div><div><label for="currency" data-i18n="currency"></label><input id="currency" pattern="[A-Z]{3}" maxlength="3" required></div></div><button class="primary full" data-i18n="prepare"></button></form><p class="small" data-i18n="approvalNote"></p></section>
<section class="panel" id="approverPanel" hidden><h2 data-i18n="reviewQueue"></h2><p data-i18n="reviewNote"></p></section>
<section class="panel assistant" id="assistantPanel"><h2 data-i18n="assistant"></h2><form id="chatForm"><label for="message" data-i18n="message"></label><textarea id="message" maxlength="4000" required></textarea><button class="full" data-i18n="send"></button></form><p id="chatReply" class="small" aria-live="polite"></p></section></aside>
<div><section class="panel"><div class="toolbar"><h2 data-i18n="recent"></h2><button id="refresh" data-i18n="refresh"></button></div><div id="proposals"></div></section><section class="panel assistant" id="casesPanel" hidden><h2 data-i18n="cases"></h2><div id="cases"></div></section></div></div>
<footer data-i18n="footer"></footer></section>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
</main>
<dialog id="review"><h2 data-i18n="review"></h2><div id="reviewOrder"></div><div id="reviewAmount" class="money"></div><p data-i18n="confirmNote"></p><div class="inline"><button id="closeReview" data-i18n="back"></button><button id="reject" data-i18n="reject"></button><button id="approve" class="primary" data-i18n="approve"></button></div></dialog>
<script>
const copy={en:{welcome:'Sign in to refund operations',signinDescription:'Use your requester or finance approver access token.',token:'Access token',signin:'Sign in',logout:'Sign out',title:'Refunds, with a clear decision.',subtitle:'Propose an exact amount. Get independent approval. Verify the outcome.',waiting:'Awaiting approval',verifiedMetric:'Verified refunds',total:'Recent proposals',newRefund:'Prepare a refund',order:'Order reference',intent:'Business intent reference',amount:'Amount',currency:'Currency',prepare:'Prepare for approval',approvalNote:'The amount is sent only after a separate finance approver authorizes it.',reviewQueue:'Your approval queue',reviewNote:'Review the order and exact amount. Accepted refunds are checked directly with Stripe.',assistant:'Refund assistant',message:'Describe the refund',send:'Ask assistant',recent:'Recent refund proposals',refresh:'Refresh',cases:'Needs follow-up',footer:'Sandbox reference app. No live payments. Outcomes reflect the latest authoritative observation.',review:'Review refund',confirmNote:'Approval authorizes this exact refund. The worker will submit it and verify the result.',back:'Back',reject:'Reject',approve:'Approve refund',empty:'No refund proposals yet.',error:'The operation could not be completed. Check access and the refund details.',modelMissing:'Configure a model to enable the assistant. You can use the refund form now.',prepared:'The proposal is ready for independent approval.',approved:'Decision recorded. The refund status will update automatically.',requester:'REQUESTER WORKSPACE',approver:'FINANCE APPROVALS',awaiting_authority:'Awaiting approval',authorized:'Approved · awaiting submission',executing:'Submitting',verification_pending:'Verifying with Stripe',verified:'Verified',denied:'Rejected',expired:'Expired',blocked:'Blocked',stale:'Details changed',superseded:'Replaced',failed_known:'Not completed',failed_unknown:'Outcome uncertain',verification_unresolved:'Needs follow-up',partially_succeeded:'Partly completed',caseRefresh:'Check latest outcome',noCases:'No open follow-up cases.',caseChecked:'Latest provider observation recorded.'},el:{welcome:'Σύνδεση στις επιστροφές',signinDescription:'Χρησιμοποιήστε το διακριτικό πρόσβασης αιτούντος ή υπευθύνου εγκρίσεων.',token:'Διακριτικό πρόσβασης',signin:'Σύνδεση',logout:'Αποσύνδεση',title:'Επιστροφές με ξεκάθαρη έγκριση.',subtitle:'Προτείνετε το ακριβές ποσό. Λάβετε ανεξάρτητη έγκριση. Επαληθεύστε το αποτέλεσμα.',waiting:'Αναμένουν έγκριση',verifiedMetric:'Επαληθευμένες επιστροφές',total:'Πρόσφατες προτάσεις',newRefund:'Νέα επιστροφή',order:'Αναφορά παραγγελίας',intent:'Μοναδική αναφορά αιτήματος',amount:'Ποσό',currency:'Νόμισμα',prepare:'Υποβολή για έγκριση',approvalNote:'Το ποσό επιστρέφεται μόνο μετά από έγκριση διαφορετικού υπευθύνου.',reviewQueue:'Εκκρεμείς εγκρίσεις',reviewNote:'Ελέγξτε την παραγγελία και το ακριβές ποσό. Το αποτέλεσμα επαληθεύεται απευθείας στη Stripe.',assistant:'Βοηθός επιστροφών',message:'Περιγράψτε την επιστροφή',send:'Ρωτήστε τον βοηθό',recent:'Πρόσφατες προτάσεις επιστροφής',refresh:'Ανανέωση',cases:'Χρειάζονται διερεύνηση',footer:'Δοκιμαστική εφαρμογή χωρίς πραγματικές πληρωμές. Τα αποτελέσματα αποτυπώνουν την τελευταία επαλήθευση.',review:'Έλεγχος επιστροφής',confirmNote:'Η έγκριση αφορά αυτή την ακριβή επιστροφή. Η εφαρμογή θα την υποβάλει και θα επαληθεύσει το αποτέλεσμα.',back:'Πίσω',reject:'Απόρριψη',approve:'Έγκριση επιστροφής',empty:'Δεν υπάρχουν προτάσεις επιστροφής.',error:'Η ενέργεια δεν ολοκληρώθηκε. Ελέγξτε την πρόσβαση και τα στοιχεία επιστροφής.',modelMissing:'Ρυθμίστε μοντέλο για τον βοηθό. Μπορείτε να χρησιμοποιήσετε τη φόρμα επιστροφής.',prepared:'Η πρόταση είναι έτοιμη για ανεξάρτητη έγκριση.',approved:'Η απόφαση καταγράφηκε. Η κατάσταση θα ενημερωθεί αυτόματα.',requester:'ΑΙΤΗΜΑΤΑ ΕΠΙΣΤΡΟΦΗΣ',approver:'ΟΙΚΟΝΟΜΙΚΕΣ ΕΓΚΡΙΣΕΙΣ',awaiting_authority:'Αναμένει έγκριση',authorized:'Εγκρίθηκε · αναμένει υποβολή',executing:'Υποβάλλεται',verification_pending:'Γίνεται επαλήθευση',verified:'Επαληθεύτηκε',denied:'Απορρίφθηκε',expired:'Έληξε',blocked:'Αποκλείστηκε',stale:'Τα στοιχεία άλλαξαν',superseded:'Αντικαταστάθηκε',failed_known:'Δεν ολοκληρώθηκε',failed_unknown:'Αβέβαιο αποτέλεσμα',verification_unresolved:'Χρειάζεται διερεύνηση',partially_succeeded:'Ολοκληρώθηκε μερικώς',caseRefresh:'Έλεγχος αποτελέσματος',noCases:'Δεν υπάρχουν ανοιχτές υποθέσεις.',caseChecked:'Καταγράφηκε η τελευταία επαλήθευση.'}};
let locale='el',bearer='',role='',items=[],selected=null,refreshing=false;const $=id=>document.getElementById(id),t=key=>copy[locale][key]||key;
function translate(){document.documentElement.lang=locale;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('language').textContent=locale==='el'?'English':'Ελληνικά';$('role').textContent=t(role);render()}
function node(tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;return el}
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+bearer,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!response.ok){if(response.status===401)signout();throw new Error(response.status===503?t('modelMissing'):t('error'))}return response.json()}
async function task(button,fn){button.disabled=true;$('notice').textContent='';try{await fn()}catch(e){$('notice').textContent=e.message}finally{button.disabled=false}}
function render(){$('proposals').replaceChildren();$('waitingCount').textContent=items.filter(p=>p.lifecycle_status==='awaiting_authority').length;$('verifiedCount').textContent=items.filter(p=>p.lifecycle_status==='verified').length;$('totalCount').textContent=items.length;if(!items.length)$('proposals').append(node('p',t('empty'),'empty'));for(const proposal of items){const preview=proposal.display_preview,row=node('div','','row'),details=node('div','');details.append(node('strong',preview.order_reference||''),node('span',t(proposal.lifecycle_status),'badge '+proposal.lifecycle_status));const last=proposal.receipts.at(-1);if(last){const d=new Date(last.observed_at);details.append(node('div',`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`,'date'))}const action=node('div','');action.append(node('div',preview.amount?`${preview.amount.amount} ${preview.amount.currency}`:'','money'));if(role==='approver'&&proposal.lifecycle_status==='awaiting_authority'){const button=node('button',t('review'));button.onclick=()=>{selected=proposal;$('reviewOrder').textContent=preview.order_reference;$('reviewAmount').textContent=`${preview.amount.amount} ${preview.amount.currency}`;$('review').showModal()};action.append(button)}row.append(details,action);$('proposals').append(row)}}
async function refresh(){if(!bearer||refreshing)return;refreshing=true;try{const current=bearer;const received=await api('/api/proposals');if(current!==bearer)return;items=received;render();if(role==='approver'){const cases=await api('/api/cases');if(current!==bearer)return;$('cases').replaceChildren();if(!cases.length)$('cases').append(node('p',t('noCases'),'small'));for(const entry of cases){const row=node('div','','row');row.append(node('span',entry.order_reference));const button=node('button',t('caseRefresh'));button.onclick=()=>task(button,async()=>{await api('/api/cases/'+encodeURIComponent(entry.effect_reference)+'/refresh',{});$('notice').textContent=t('caseChecked');await refresh()});row.append(button);$('cases').append(row)}}}finally{refreshing=false}}
function signout(){bearer='';items=[];role='';$('workspace').hidden=true;$('login').hidden=false;$('logout').hidden=true;$('token').value='';$('review').close()}
$('language').onclick=()=>{locale=locale==='el'?'en':'el';translate();refresh().catch(e=>$('notice').textContent=e.message)};$('logout').onclick=signout;
$('loginForm').onsubmit=e=>{e.preventDefault();task(e.submitter,async()=>{bearer=$('token').value;const session=await api('/api/session');role=session.role;$('token').value='';$('login').hidden=true;$('workspace').hidden=false;$('logout').hidden=false;$('requestPanel').hidden=role!=='requester';$('assistantPanel').hidden=role!=='requester';$('approverPanel').hidden=role!=='approver';$('casesPanel').hidden=role!=='approver';translate();await refresh()})};
$('refundForm').onsubmit=e=>{e.preventDefault();task(e.submitter,async()=>{await api('/api/proposals',{order_reference:$('order').value,intent_reference:$('intent').value,amount:{amount:$('amount').value,currency:$('currency').value}});$('notice').textContent=t('prepared');await refresh()})};
$('chatForm').onsubmit=e=>{e.preventDefault();task(e.submitter,async()=>{const reply=await api('/api/chat',{message:$('message').value});$('chatReply').textContent=reply.awaiting_approval?t('prepared'):reply.message;await refresh()})};
$('refresh').onclick=()=>task($('refresh'),refresh);$('closeReview').onclick=()=>$('review').close();for(const [id,approve] of [['approve',true],['reject',false]])$(id).onclick=()=>task($(id),async()=>{if(!selected)return;await api('/api/proposals/'+encodeURIComponent(selected.proposal_reference)+'/decision',{approve});$('review').close();$('notice').textContent=t('approved');await refresh()});setInterval(()=>refresh().catch(e=>$('notice').textContent=e.message),5000);translate();
</script></body></html>
