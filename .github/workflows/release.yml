name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a candidate or promote an already qualified candidate
        required: true
        type: choice
        options: [candidate, promote]
      release_tag:
        description: Exact release tag, for example v0.1.4
        required: true
        type: string
      candidate_run_id:
        description: Candidate workflow run id; required only for promotion
        required: false
        type: string
      candidate_source_commit:
        description: Candidate source SHA; required only for promotion
        required: false
        type: string
      adoption_record_digest:
        description: SHA-256 of the current hash-linked DX evidence record
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.operation }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-candidate-source:
    if: inputs.operation == 'candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a reviewed main-branch source commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit already contained in main." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be an exact vX.Y.Z tag" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: uv run --no-project python scripts/verify_release.py --tag "$RELEASE_TAG"

  build-candidate:
    if: inputs.operation == 'candidate'
    needs: validate-candidate-source
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: >-
          uv sync --extra dev --extra mysql --extra pydantic-ai
          --extra postgres --extra docs --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/threvo_actions examples benchmarks scripts
      - run: uv run pytest -q
      - run: uv run bandit -q -c pyproject.toml -r src examples benchmarks scripts
      - run: uv run pip-audit
      - run: uv run mkdocs build --strict
      - run: uv build
      - run: uv run python scripts/verify_release.py --dist dist
      - name: Record candidate-source-commit and artifact digests
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release/packages
          mv dist/*.whl dist/*.tar.gz release/packages/
          mv dist/SHA256SUMS release/SHA256SUMS
          uv run python scripts/verify_release.py \
            --tag "$RELEASE_TAG" \
            --record-candidate release \
            --source-commit "$GITHUB_SHA"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/packages/*.whl
            release/packages/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: release/
          if-no-files-found: error
          retention-days: 30

  qualify-artifacts:
    if: inputs.operation == 'candidate'
    needs: build-candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        profile: [core, postgres, pydantic-ai, all]
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel and source distribution in empty environments
        env:
          PROFILE: ${{ matrix.profile }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$PROFILE" in
            core) profile_extras="" ;;
            postgres) profile_extras="[postgres]" ;;
            pydantic-ai) profile_extras="[pydantic-ai]" ;;
            all) profile_extras="[mysql,postgres,pydantic-ai]" ;;
            *) exit 1 ;;
          esac
          for artifact in release/packages/*.whl release/packages/*.tar.gz; do
            consumer_root=$(mktemp -d)
            uv venv --python "${{ matrix.python-version }}" "$consumer_root/venv"
            uv pip install \
              --python "$consumer_root/venv/bin/python" \
              "${artifact}${profile_extras}"
            "$consumer_root/venv/bin/python" - <<PY
          import importlib.util
          import threvo_actions
          import threvo_actions.experimental

          assert threvo_actions.__version__ == "${RELEASE_TAG#v}"
          assert "ActionApplication" not in threvo_actions.__all__
          if "$PROFILE" == "core":
              for module in ("aiomysql", "asyncpg", "pydantic_ai", "sqlalchemy"):
                  assert importlib.util.find_spec(module) is None, module
          PY
          done

  qualify-pydantic:
    if: inputs.operation == 'candidate'
    needs: build-candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic: ["2.10.6", latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Run typing smoke against the supported Pydantic range
        env:
          PYDANTIC_VERSION: ${{ matrix.pydantic }}
        run: |
          consumer_root=$(mktemp -d)
          uv venv --python 3.11 "$consumer_root/venv"
          wheel=$(find release/packages -name '*.whl' -print -quit)
          if test "$PYDANTIC_VERSION" = latest; then
            pydantic_requirement='pydantic>=2.10,<3'
          else
            pydantic_requirement="pydantic==$PYDANTIC_VERSION"
          fi
          uv pip install --python "$consumer_root/venv/bin/python" \
            "$wheel" "$pydantic_requirement" mypy pytest
          cp -R tests/typing "$consumer_root/typing"
          cd "$consumer_root"
          "$consumer_root/venv/bin/python" -m pytest -q \
            typing/test_experimental_application_typing.py

  qualify-examples:
    if: inputs.operation == 'candidate'
    needs: build-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run source-distribution examples against the candidate wheel
        run: |
          consumer_root=$(mktemp -d)
          uv venv "$consumer_root/venv"
          wheel=$(find release/packages -name '*.whl' -print -quit)
          uv pip install --python "$consumer_root/venv/bin/python" \
            "${wheel}[mysql,postgres,pydantic-ai]" fastapi httpx pytest
          tar -xzf "$(find release/packages -name '*.tar.gz' -print -quit)" \
            -C "$consumer_root"
          extracted_root=$(find "$consumer_root" -maxdepth 1 -type d \
            -name 'threvo_actions-*' -print -quit)
          cp -R "$extracted_root/examples" "$consumer_root/examples"
          cd "$consumer_root"
          "$consumer_root/venv/bin/python" -m pytest -q \
            examples/refund/test_example.py \
            examples/supplier_destination/test_example.py
          "$consumer_root/venv/bin/python" -m examples.docs.quickstart
          "$consumer_root/venv/bin/python" -m examples.docs.pydantic_ai_agent
          "$consumer_root/venv/bin/python" -m examples.docs.pydantic_ai_deferred

  review-promotion:
    if: inputs.operation == 'promote'
    runs-on: ubuntu-latest
    environment:
      name: release-review
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require complete promotion evidence inputs
        env:
          ADOPTION_RECORD_DIGEST: ${{ inputs.adoption_record_digest }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
        run: |
          test -n "$CANDIDATE_RUN_ID"
          printf '%s\n' "$CANDIDATE_SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$ADOPTION_RECORD_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
      - name: Require a successful candidate qualification run
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
        with:
          script: |
            const runId = Number(process.env.CANDIDATE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('Candidate run id must be a positive integer.');
              return;
            }
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (run.data.event !== 'workflow_dispatch') {
              core.setFailed('Candidate must come from a manual release workflow run.');
              return;
            }
            if (run.data.path !== '.github/workflows/release.yml') {
              core.setFailed('Candidate run used a different workflow.');
              return;
            }
            if (run.data.head_branch !== 'main') {
              core.setFailed('Candidate run did not build from main.');
              return;
            }
            if (run.data.head_sha !== process.env.CANDIDATE_SOURCE_COMMIT) {
              core.setFailed('Candidate run source commit differs.');
              return;
            }
            if (run.data.conclusion !== 'success') {
              core.setFailed(`Candidate qualification did not pass: ${run.data.conclusion}`);
            }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_source_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Candidate tag must point to the candidate source commit
        env:
          ADOPTION_RECORD_DIGEST: ${{ inputs.adoption_record_digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be an exact vX.Y.Z tag" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          git show origin/main:docs/testing/gradual-reveal-adoption.md \
            > adoption-evidence.md
          printf '%s  %s\n' "$ADOPTION_RECORD_DIGEST" adoption-evidence.md \
            | sha256sum --check --strict
          grep -F 'Promotion gate: **passed**' adoption-evidence.md
          uv run --no-project python scripts/verify_release.py \
            --tag "$RELEASE_TAG" \
            --verify-candidate release \
            --source-commit "$SOURCE_COMMIT"
      - name: Require a GitHub-verified annotated tag at the candidate commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${process.env.RELEASE_TAG}`,
            });
            if (ref.data.object.type !== 'tag') {
              core.setFailed('Release tag must be annotated and signed.');
              return;
            }
            const tag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: ref.data.object.sha,
            });
            if (!tag.data.verification?.verified) {
              core.setFailed(`GitHub did not verify the release tag: ${tag.data.verification?.reason}`);
              return;
            }
            if (tag.data.object.sha !== process.env.SOURCE_COMMIT) {
              core.setFailed('Signed tag must point to the candidate source commit.');
            }

  publish-testpypi:
    if: inputs.operation == 'promote'
    needs: review-promotion
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/threvo-actions/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_source_commit }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Revalidate candidate bytes before public publication
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
        run: >-
          uv run --no-project python scripts/verify_release.py
          --tag "$RELEASE_TAG"
          --verify-candidate release
          --source-commit "$SOURCE_COMMIT"
      - name: Revalidate the signed tag before public publication
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${process.env.RELEASE_TAG}`,
            });
            if (ref.data.object.type !== 'tag') {
              core.setFailed('Release tag must remain annotated and signed.');
              return;
            }
            const tag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: ref.data.object.sha,
            });
            if (!tag.data.verification?.verified || tag.data.object.sha !== process.env.SOURCE_COMMIT) {
              core.setFailed('Release tag identity changed after candidate review.');
            }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/packages
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_source_commit }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python scripts/verify_index_artifacts.py \
            --repository testpypi \
            --version "${RELEASE_TAG#v}" \
            --release release \
            --attempts 12

  publish-pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/threvo-actions/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_source_commit }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Revalidate candidate bytes before PyPI publication
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
        run: >-
          uv run --no-project python scripts/verify_release.py
          --tag "$RELEASE_TAG"
          --verify-candidate release
          --source-commit "$SOURCE_COMMIT"
      - name: Revalidate the signed tag before PyPI publication
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${process.env.RELEASE_TAG}`,
            });
            if (ref.data.object.type !== 'tag') {
              core.setFailed('Release tag must remain annotated and signed.');
              return;
            }
            const tag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: ref.data.object.sha,
            });
            if (!tag.data.verification?.verified || tag.data.object.sha !== process.env.SOURCE_COMMIT) {
              core.setFailed('Release tag identity changed before PyPI publication.');
            }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/packages

  verify-pypi:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_source_commit }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: release
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify PyPI bytes and record release provenance
        env:
          ADOPTION_RECORD_DIGEST: ${{ inputs.adoption_record_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python scripts/verify_index_artifacts.py \
            --repository pypi \
            --version "${RELEASE_TAG#v}" \
            --release release \
            --attempts 12
          git fetch --no-tags origin main:refs/remotes/origin/main
          git show origin/main:docs/testing/gradual-reveal-adoption.md \
            > release/ADOPTION-EVIDENCE.md
          printf '%s  %s\n' "$ADOPTION_RECORD_DIGEST" release/ADOPTION-EVIDENCE.md \
            | sha256sum --check --strict
          gh release create "$RELEASE_TAG" \
            release/packages/* release/SHA256SUMS release/CANDIDATE.json \
            release/ADOPTION-EVIDENCE.md \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file docs/releases/0.1.4.md
