site_name: threvo-actions
site_description: Confirm-first financial actions for Python applications and agents
site_url: https://blackpigindustries.github.io/threvo-actions/
repo_url: https://github.com/BlackPigIndustries/threvo-actions
repo_name: BlackPigIndustries/threvo-actions
edit_uri: edit/develop/docs/

theme:
  name: material
  language: en
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: lime
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Use light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_bases: true
            show_if_no_docstring: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            signature_crossrefs: true

nav:
  - Overview: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first action: getting-started/first-action.md
      - How the lifecycle works: getting-started/lifecycle.md
  - Features:
      - Typed action contracts: features/action-contracts.md
      - Private state and commitments: features/private-state.md
      - Confirm-first authority: features/confirm-first.md
      - Drift refusal and idempotency: features/drift-and-idempotency.md
      - Authoritative verification: features/verification.md
      - Receipts and evidence: features/receipts.md
      - Retention and erasure: features/retention.md
  - Integrations:
      - Coding agents: integrations/coding-agents.md
      - Pydantic AI: integrations/pydantic-ai.md
      - PostgreSQL quickstart: integrations/postgres.md
      - PostgreSQL deployment: postgres.md
      - SQLAlchemy and Alembic: integrations/sqlalchemy-alembic.md
      - MySQL: integrations/mysql.md
      - SQLite: integrations/sqlite.md
      - Custom stores: integrations/custom-stores.md
  - Testing:
      - Testing helpers: testing/helpers.md
      - Conformance testing: testing/conformance.md
      - Clean-room adoption result: testing/clean-room-adoption-2026-08-30.md
      - Security model: threat-model.md
      - Guarantees and limitations: guarantees-and-limitations.md
  - Examples:
      - Overview: examples/index.md
      - Lifecycle edge cases: examples/lifecycle-scenarios.md
      - Refund: examples/refund.md
      - Supplier destination change: examples/supplier-destination.md
  - Reference:
      - Public API: reference/index.md
      - Action authoring and approvals: reference/action.md
      - Runtime: reference/runtime.md
      - Action definitions and ports: reference/registry.md
      - Boundary models: reference/models.md
      - Authority evidence: reference/authority.md
      - Receipts and events: reference/receipts.md
      - Stores: reference/stores.md
      - Canonicalization and protection: reference/canonical.md
      - Testing helpers: reference/testing.md
      - Pydantic AI: reference/pydantic-ai.md
      - PostgreSQL and migrations: reference/postgres.md
      - MySQL and migrations: reference/mysql.md
      - SQLite and migrations: reference/sqlite.md
      - Migration compatibility: reference/migration-compatibility.md
      - Database readiness: reference/readiness.md
      - Conformance helpers: reference/conformance.md
      - CLI: reference/cli.md
  - Project:
      - Versioning: versioning.md
      - Release record 0.1.2: releases/0.1.2.md
      - Release record 0.1.1: releases/0.1.1.md
      - Release record 0.1.0: releases/0.1.0.md
      - Performance: benchmarks/runtime-overhead.md
      - Integration methodology: integration-surface-methodology.md

strict: true
